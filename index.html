<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> إدارة نتائج الطلاب</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <div class="container py-5">

        <header class="text-center mb-5">
            <h1 class="main-title">نظام إدارة نتائج الطلاب</h1>
            <p class="subtitle">Student Results Management System</p>
        </header>

        <!-- Student Form -->
        <section class="card shadow p-4 mb-4">

            <h3 class="section-title">إضافة طالب جديد</h3>

            <div class="mb-3">
                <label class="form-label">اسم الطالب</label>
                <input type="text" id="studentName" class="form-control"
                    placeholder="اكتب اسم الطالب">
            </div>

            <div class="row">

                <div class="col-md-4 mb-3">
                    <label class="form-label">المادة الأولى</label>
                    <input type="number" id="grade1" class="form-control"
                        placeholder="الدرجة من 100">
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">المادة الثانية</label>
                    <input type="number" id="grade2" class="form-control"
                        placeholder="الدرجة من 100">
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">المادة الثالثة</label>
                    <input type="number" id="grade3" class="form-control"
                        placeholder="الدرجة من 100">
                </div>

            </div>

            <div class="mb-4">
                <label class="form-label">نسبة الحضور</label>
                <input type="number" id="attendance" class="form-control"
                    placeholder="نسبة الحضور من 100">
            </div>

            <button id="addStudent" class="btn btn-primary w-100">
                إضافة طالب
            </button>

        </section>

        <!-- Error Messages -->
        <div id="errorBox" class="alert alert-danger d-none"></div>

        <!-- Students List -->
        <section class="card shadow p-4 mb-4">

            <h3 class="section-title">قائمة الطلاب</h3>

            <div id="studentsList">
                <p class="text-muted">لا يوجد طلاب مضافون حتى الآن.</p>
            </div>

        </section>

        <!-- Mercy Committee -->
        <section class="card shadow p-4">

            <h3 class="section-title">لجنة الرأفة</h3>

            <p class="text-muted">
                اضغط على الزر لمعالجة الطلاب الذين يتراوح متوسط درجاتهم بين 40 و49.
            </p>

            <button id="mercyBtn" class="btn btn-success w-100 mb-3">
                تفعيل لجنة الرأفة
            </button>

            <div id="reportBox">
                <p class="text-muted">التقرير النهائي سيظهر هنا.</p>
            </div>

        </section>

    </div>

    <!-- JavaScript -->
    <script src="./js/main.js"></script>

</body>
</html>
